<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Inline fallback for very small viewports */
  </style>
</head>
<body>
  <main class="container">
    <h1>Lista de tareas</h1>

    <form id="task-form" aria-label="Añadir tarea">
      <label for="task-input" class="visually-hidden">Nueva tarea</label>
      <input id="task-input" type="text" placeholder="Añadir nueva tarea..." autocomplete="off" />
      <button id="add-btn" type="submit">Añadir</button>
    </form>

    <section>
      <ul id="tasks" aria-live="polite"></ul>
    </section>

    <div class="controls">
      <span id="counter">0 tareas</span>
      <button id="clear-btn">Vaciar todas</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
